name: Executáveis

# Gera o executável para Windows, Linux e macOS.
# Em uma tag v* (ex.: git tag v0.2.0 && git push --tags) anexa-os a uma Release.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset: panografia-windows.exe
            binary: dist/panografia.exe
          - os: ubuntu-latest
            asset: panografia-linux
            binary: dist/panografia
          - os: macos-latest
            asset: panografia-macos
            binary: dist/panografia
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pyinstaller
      - run: pyinstaller --noconfirm panografia.spec
      - name: Teste rápido do executável (modo CLI)
        shell: bash
        run: ${{ matrix.binary }} data/img1.png data/img2.png -o saida_ci
      - shell: bash
        run: mv "${{ matrix.binary }}" "${{ matrix.asset }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}
